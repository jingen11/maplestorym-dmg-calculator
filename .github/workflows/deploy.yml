name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than racing CloudFormation.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for AWS OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - name: Install site deps
        run: npm ci

      # Root tsconfig type-checks infra/**, so aws-cdk-lib must be installed
      # before `next build` runs.
      - name: Install infra deps
        run: npm ci
        working-directory: infra

      - name: Build static export
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      # The site stack uploads ../out, so this must run after the build.
      # Both stacks deploy together (the cert stack lives in us-east-1).
      - name: CDK deploy
        run: npx cdk deploy --all --require-approval never
        working-directory: infra
